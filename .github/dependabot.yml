# Weekly pull requests for the actions the workflows pin by commit SHA.
# Minor and patch releases come grouped; a major release comes on its own.
# A release has to be a week old before it is proposed, which keeps a
# hijacked release that is yanked within days out of the proposals.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only, also when release.yml calls this workflow.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: lsof
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test ./...
      - run: go build -o fride . && ./fride version
